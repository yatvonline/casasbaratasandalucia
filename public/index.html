          "mainEntity": [
            {
              "@type": "Question",
              "name": "¿Cómo me uno al canal de Telegram?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El canal es privado. Para acceder, escribe un email a dosmaresmagazine@gmail.com contando qué buscas (provincia, tipo de vivienda, presupuesto). Te incluimos manualmente en el canal en 24-48h."
              }
            },
            {
              "@type": "Question",
              "name": "¿Por qué no es entrada libre?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Filtramos manualmente para mantener el canal limpio: solo gente que de verdad busca casa o invertir. Eso protege la calidad de las oportunidades y la prioridad de los miembros."
              }
            },
            {
              "@type": "Question",
              "name": "¿Cuánto cuesta unirse al canal?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "El acceso es gratuito. Solo te pedimos un email de contacto y un poco de contexto sobre lo que buscas para enviarte oportunidades relevantes."
              }
            },
            {
              "@type": "Question",
              "name": "¿Por qué algunas casas no aparecen en Idealista?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Muchas viviendas en pueblos andaluces se venden por boca a boca, a través de colaboradores locales, herencias, o propietarios que no quieren publicidad masiva. Por eso nunca llegan a portales generalistas y solo se mueven en circuitos cerrados."
              }
            },
            {
              "@type": "Question",
              "name": "¿Qué tipo de casas se publican?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Casas de pueblo, viviendas para reformar, oportunidades de inversión, casas para teletrabajar y operaciones off-market en provincias como Cádiz, Málaga, Jaén, Granada, Córdoba, Sevilla, Huelva y Almería."
              }
            },
            {
              "@type": "Question",
              "name": "¿Sois una inmobiliaria?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. Somos un canal de difusión independiente. Trabajamos con colaboradores locales y conectamos compradores con oportunidades. La operación se cierra siempre con el agente, propietario o profesional que tramita la venta."
              }
            }
          ]
        }
        </script>
